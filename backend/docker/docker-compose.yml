version: "3.9"

services:
  # =========================================================================
  # PostgreSQL Database
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: typeforge-postgres
    environment:
      POSTGRES_DB: typeforge_db
      POSTGRES_USER: typeforge
      POSTGRES_PASSWORD: typeforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typeforge -d typeforge_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Redis (Cache, Leaderboards, Celery Broker)
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: typeforge-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Django Application
  # =========================================================================
  django:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: typeforge-django
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
    env_file:
      - ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DB_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - CACHE_REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # =========================================================================
  # Celery Worker
  # =========================================================================
  celery:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: typeforge-celery
    command: celery -A config.celery worker --loglevel=info --concurrency=2
    volumes:
      - ..:/app
    env_file:
      - ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DB_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - CACHE_REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # =========================================================================
  # Celery Beat (Scheduler)
  # =========================================================================
  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: typeforge-celery-beat
    command: celery -A config.celery beat --loglevel=info
    volumes:
      - ..:/app
    env_file:
      - ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DB_HOST=postgres
      - CELERY_BROKER_URL=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
